<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Clean mono rendering: full hinting + no subpixel (no color fringing) -->
<fontconfig>
  <!-- Anti-aliasing -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Subpixel: off — grayscale antialiasing, no RGB fringing -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!-- No LCD filter (no subpixel -> filter is meaningless) -->
  <match target="font">
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Hinting: full for crisp glyph edges at small sizes -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <!-- <edit name="hintstyle" mode="assign"><const>hintfull</const></edit> -->

    
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <!-- Autohint fallback when the font has no native hints -->
  <match target="font">
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
