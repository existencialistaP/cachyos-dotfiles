# Registro unico de perfis do CachyOS. Tanto o bootstrap.sh quanto os testes
# leem este arquivo; nao existe outro lugar onde perfis sao definidos.
#
# Cada perfil lista manifests por gerenciador. Um manifest e um arquivo com um
# pacote por linha:
#   official = packages/official/<nome>.txt   (pacman)
#   aur      = packages/aur/<nome>.txt        (paru)
#   flatpak  = packages/flatpak/<nome>.txt    (flathub)
#   user     = packages/<nome>.txt            (pipx, uv, bun, npm globais)
#   manual   = packages/manual/<nome>.toml    (git/AppImage com receita propria)

# Ordem canonica: define o `--all` e a numeracao do menu.
order = [
    "core",
    "desktop-niri",
    "shell-editor",
    "dev-web",
    "dev-containers-db",
    "dev-android-flutter",
    "dev-jvm-php",
    "dev-native",
    "apps-daily",
    "apps-media",
    "ai-harness",
]

# Sem flags de perfil, o bootstrap sempre instala estes e oferece o resto.
default_profiles = ["core", "desktop-niri", "shell-editor"]
optional_profiles = [
    "dev-web",
    "dev-containers-db",
    "dev-android-flutter",
    "dev-jvm-php",
    "dev-native",
    "apps-daily",
    "apps-media",
    "ai-harness",
]

[profiles.core]
description = "Base do sistema: repos, chezmoi e ferramentas de build"
official = ["core"]
aur = []
flatpak = []
user = []
manual = []

[profiles.desktop-niri]
description = "Niri + barra + tema (pywal) + portal de tela"
official = ["desktop-niri"]
aur = ["desktop-niri"]
flatpak = []
user = ["pipx"]
manual = []

[profiles.shell-editor]
description = "Fish, Neovim (NvChad) e utilitarios de shell"
official = ["shell-editor"]
