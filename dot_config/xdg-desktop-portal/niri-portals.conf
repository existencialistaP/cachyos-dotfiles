# niri: o ScreenCast do xdg-desktop-portal-gnome nao funciona nesta maquina.
# niri exporta a API org.gnome.Mutter.ScreenCast, mas a sessao morre logo
# depois do Start: o pipewire devolve o format com
# modifier=DRM_FORMAT_MOD_INVALID (Choice), o niri responde
# "wrong modifier choice type" e o stream fecha -> o app (Firefox/Discord/OBS)
# fica com tela preta ou sem stream nenhum. Mesmo sintoma do
# https://github.com/niri-wm/niri/issues/3700 (niri 25.11/26.04 + GPU hibrida).
#
# O xdg-desktop-portal-wlr fala com o niri via ext-image-copy-capture e
# entrega o stream certo. Desviamos APENAS o ScreenCast; todo o resto
# (FileChooser, Settings, Screenshot, RemoteDesktop...) continua em gnome/gtk
# igual antes, porque este arquivo nao define `default=`.
#
# Se um dia o backend gnome voltar a funcionar, apague este arquivo e
# `systemctl --user restart xdg-desktop-portal`.
[preferred]
org.freedesktop.impl.portal.ScreenCast=niri;wlr;
