general {
    ignore_empty_input = true

    hide_cursor = true
}

background {
    monitor =
     path = ~/.cache/wal/current-wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
    color = rgb(13,7,22)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(194,193,196)
    font_size = 72
    font_family = Lilex

    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %b"
    color = rgb(96,78,117)
    font_size = 20
    font_family = Lilex

    position = 0, 225
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.6
    dots_center = true

    outer_color = rgb(76,42,183)
    inner_color = rgb(13,7,22)
    font_color = rgb(194,193,196)
    check_color = rgb(76,42,183)
    fail_color = rgb(104,30,133)
    capslock_color = rgb(201,64,44)

    fade_on_empty = false
    hide_input = false

    position = 0, -90
    halign = center
    valign = center

    placeholder_text = <i>Enter password...</i>
    fail_text = <i>Incorrect password. Try again.</i>
}
